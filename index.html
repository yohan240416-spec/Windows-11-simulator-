<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Windows 11 - v1.6.2</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{width:100vw;height:100vh;overflow:hidden;background:#0b53d6;position:relative}
/* PAPEL DE PAREDE FEITO EM CSS - NÃO PRECISA DE LINK */
#wallpaper{
  position:absolute;top:0;left:0;width:100%;height:100%;
  background: radial-gradient(ellipse at 50% 100%, #1a7ee8 0%, #0b53d6 40%, #08285e 100%);
}
#wallpaper::before{
  content:'';position:absolute;bottom:-20%;left:50%;transform:translateX(-50%);
  width:80%;height:70%;background: radial-gradient(ellipse, #6ec6ff 0%, #1a7ee8 50%, transparent 70%);
  filter:blur(30px);opacity:0.8;
}
#wallpaper::after{
  content:'';position:absolute;bottom:10%;left:50%;transform:translateX(-50%) rotate(0deg);
  width:120%;height:120%;background: linear-gradient(180deg, transparent 0%, #0a3a8a 80%);
  clip-path: ellipse(40% 30% at 50% 100%);
}
/* DESKTOP */
#desktop{position:relative;width:100%;height:calc(100% - 48px);padding:10px;z-index:1}
.icon{width:75px;text-align:center;padding:8px 2px;border-radius:5px;color:white;margin-bottom:5px}
.icon.selected{background:rgba(255,255,255,0.2);border:1px solid rgba(255,255,255,0.3)}
.icon img{width:44px;height:44px;filter:drop-shadow(0 2px 3px rgba(0,0,0,0.3))}
.icon span{font-size:12px;display:block;margin-top:4px;text-shadow:0 1px 3px black}
/* TASKBAR WINDOWS 11 */
#taskbar{
  position:absolute;bottom:0;left:0;width:100%;height:48px;
  background:rgba(242,242,242,0.85);backdrop-filter: blur(20px);
  display:flex;align-items:center;justify-content:center;
  border-top:1px solid rgba(255,255,255,0.5);z-index:10;
}
#taskbar-center{display:flex;align-items:center;gap:14px}
.task-icon{width:32px;height:32px;border-radius:4px;display:flex;align-items:center;justify-content:center;transition:0.2s}
.task-icon:active{background:rgba(0,0,0,0.1);transform:scale(0.9)}
.task-icon img{width:24px;height:24px}
#start-btn img{width:20px}
#widgets{position:absolute;left:12px;display:flex;gap:8px}
#tray{position:absolute;right:12px;display:flex;align-items:center;gap:10px;font-size:12px;color:#000}
</style>
</head>
<body>
<div id="wallpaper"></div>
<div id="desktop">
  <div class="icon" onclick="this.classList.toggle('selected')">
    <img src="https://cdn-icons-png.flaticon.com/512/2891/2891491.png">
    <span>Lixeira</span>
  </div>
  <div class="icon" onclick="this.classList.toggle('selected')">
    <img src="https://cdn-icons-png.flaticon.com/512/1087/1087815.png">
    <span>Edge</span>
  </div>
  <div class="icon" onclick="this.classList.toggle('selected')">
    <img src="https://cdn-icons-png.flaticon.com/512/3178/3178287.png">
    <span>Pastas</span>
  </div>
</div>

<div id="taskbar">
  <div id="widgets"><span style="font-size:18px">☁️ 24°</span></div>
  <div id="taskbar-center">
    <div class="task-icon" id="start-btn"><img src="https://cdn-icons-png.flaticon.com/512/732

<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Windows Simulator 2.0 - Yohan</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Arial; height:100vh; overflow:hidden; background-size:cover; background-position:center; transition:0.5s}
body.win11{background-image:url('https://4kwallpapers.com/images/wallpapers/windows-11-dark-mode-4480x2520-12026.jpg')}
body.winxp{background-image:url('https://c4.wallpaperflare.com/wallpaper/650/883/624/macos-big-sur-apple-layers-fluidic-colorful-dark-wwdc-2020-hd-wallpaper-preview.jpg')}
body.winvista{background-image:url('https://wallpapers.com/images/hd/windows-vista-4k-qv6i2bpe6b7l2a3a.jpg')}
body.win7{background-image:url('https://wallpaperaccess.com/full/1223057.jpg')}

#desktop{padding:15px; display:flex; gap:15px; flex-wrap:wrap}
.icon{width:90px; text-align:center; color:white; text-shadow:1px 1px 3px black; cursor:pointer; padding:5px; border-radius:5px}
.icon:hover{background:rgba(255,255,255,0.2)}
.icon div{font-size:40px}

#taskbar{position:fixed; bottom:0; width:100%; height:50px; background:rgba(20,20,20,0.85); backdrop-filter:blur(10px); display:flex; align-items:center; padding:0 10px}
#btnStart{background:white; border:none; padding:8px 18px; border-radius:6px; font-weight:bold; cursor:pointer}

#startMenu{position:fixed; bottom:60px; left:10px; width:320px; background:white; border-radius:12px; padding:15px; display:none; box-shadow:0 10px 30px rgba(0,0,0,0.5)}
#startMenu h3{margin-bottom:10px}
#startMenu button{width:100%; text-align:left; padding:12px; margin:4px 0; border:none; background:#f0f0f0; border-radius:8px; cursor:pointer; font-size:15px}
#startMenu button:hover{background:#0078d4; color:white}

.window{position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); width:85%; max-width:700px; height:75%; background:white; border-radius:12px; display:none; flex-direction:column; overflow:hidden; box-shadow:0 0 40px rgba(0,0,0,0.6)}
.winHeader{background:#0078d4; color:white; padding:12px 15px; display:flex; justify-content:space-between; align-items:center; font-weight:bold}
.winContent{flex:1; padding:15px; overflow:auto}
.grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px}
.card{background:#f5f5f5; padding:15px; border-radius:10px; text-align:center; cursor:pointer; border:2px solid transparent}
.card:hover{border-color:#0078d4; background:#e6f2ff}
.card div{font-size:40px}
</style>
</head>
<body class="win11">

<div id="desktop"></div>

<div id="taskbar"><button id="btnStart" onclick="toggleStart()">⊞ Iniciar</button></div>

<div id="startMenu">
<h3>🖥️ Escolher Sistema</h3>
<button onclick="changeTheme('winxp')"> Windows XP (Pesado)</button>
<button onclick="changeTheme('winvista')"> Windows Vista (Pesado)</button>
<button onclick="changeTheme('win7')"> Windows 7 (Pesado)</button>
<button onclick="changeTheme('win11')"> Windows 11 (Padrão)</button>
<hr style="margin:10px 0">
<button onclick="openWin('storeWin')"> 🛒 Loja de Apps</button>
<button onclick="openWin('chromeWin')"> 🌐 Windows Chrome 115</button>
</div>

<div id="storeWin" class="window">
<div class="winHeader"><span>Windows Store - Instala de verdade!</span><span onclick="closeWin('storeWin')" style="cursor:pointer">✕</span></div>
<div class="winContent">
<div class="grid" id="storeGrid"></div>
<p style="margin-top:15px; color:gray; font-size:12px">* Ao clicar em Instalar, o ícone aparece na área de trabalho e você pode jogar à vontade!</p>
</div>
</div>

<div id="chromeWin" class="window">
<div class="winHeader"><span>Windows Chrome 115 - Meu Google</span><span onclick="closeWin('chromeWin')" style="cursor:pointer">✕</span></div>
<div class="winContent" style="display:flex; flex-direction:column; padding:0">
<div style="padding:10px; display:flex; gap:8px; background:#f0f0f0">
<input id="searchBox" type="text" placeholder="Pesquisar no Windows Chrome 115..." style="flex:1; padding:10px; border-radius:20px; border:1px solid #ccc">
<button onclick="doSearch()" style="padding:10px 20px; border-radius:20px; border:none; background:#0078d4; color:white; cursor:pointer">Pesquisar</button>
</div>
<iframe id="chromeFrame" src="https://duckduckgo.com/" style="flex:1; border:none; width:100%"></iframe>
</div>
</div>

<script>
let desktop = document.getElementById('desktop');
let storeGrid = document.getElementById('storeGrid');

let apps = [
{nome:'Roblox', emoji:'🟥', link:'https://www.roblox.com/pt'},
{nome:'PK XD', emoji:'🎮', link:'https://www.pkxdgame.com/'},
{nome:'Craftsman', emoji:'⛏️', link:'https://www.crazygames.com/game/craftsman-building-craft'},
{nome:'Windows Chrome 115', emoji:'🌐', link:'CHROME'}
];

function renderStore(){
storeGrid.innerHTML='';
apps.forEach((app,i)=>{
storeGrid.innerHTML+=`<div class="card" onclick="installApp(${i})"><div>${app.emoji}</div><b>${app.nome}</b><br><small>Instalar</small></div>`;
});
}
renderStore();

function installApp(i){
let app = apps[i];
if(app.link==='CHROME'){openWin('chromeWin'); toggleStart(); return;}
let id = 'app-'+Date.now();
desktop.innerHTML+=`<div class="icon" id="${id}" onclick="window.open('${app.link}','_blank')"><div>${app.emoji}</div>${app.nome}</div>`;
alert(app.nome+' instalado! Agora é só clicar nele na área de trabalho pra jogar!');
closeWin('storeWin');
}

function changeTheme(t){document.body.className=t; toggleStart();}
function toggleStart(){let m=document.getElementById('startMenu'); m.style.display=m.style.display==='block'?'none':'block';}
function openWin(id){document.getElementById(id).style.display='flex';}
function closeWin(id){document.getElementById(id).style.display='none';}
function doSearch(){
let q=document.getElementById('searchBox').value;
if(!q) return;
document.getElementById('chromeFrame').src='https://duckduckgo.com/?q='+encodeURIComponent(q);
}
window.onload=()=>{console.log('Windows Simulator 2.0 - Yohan - Suporte XP/Vista/7/11 - APK Pesado');}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Windows 11 Simulator - v1.6.1</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{height:100vh;overflow:hidden;background:#000}
#desktop{
  width:100%;height:100vh;
  background: url('https://cdn.wallpapersafari.com/43/71/e29uQ2.jpg') no-repeat center/cover;
  background-color:#0078d4;
  position:relative;
}
.icon{
  width:80px;text-align:center;color:white;margin:15px 10px;cursor:pointer;user-select:none;
  text-shadow:0 1px 3px rgba(0,0,0,.6);padding:5px;border-radius:5px;
}
.icon:hover{background:rgba(255,255,255,.15)}
.icon img{width:48px;height:48px;display:block;margin:0 auto 5px}
.icon span{font-size:12px}
#taskbar{
  position:absolute;bottom:0;left:0;right:0;height:52px;
  background:rgba(243,243,243,.85);backdrop-filter:blur(20px);
  display:flex;align-items:center;justify-content:space-between;padding:0 15px;z-index:100;
}
.center{flex:1;display:flex;justify-content:center;align-items:center;gap:10px}
.task-btn{width:38px;height:38px;border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.task-btn:hover{background:rgba(0,0,0,.08)}
.search{width:200px;height:32px;background:white;border-radius:20px;display:flex;align-items:center;padding:0 12px;gap:8px}
.search input{border:none;outline:none;width:100%;font-size:13px}
.right{display:flex;align-items:center;gap:12px;font-size:12px;color:#222}
#startMenu{
  position:absolute;bottom:60px;left:50%;transform:translateX(-50%);
  width:600px;max-width:95%;height:600px;background:rgba(243,243,243,.96);
  backdrop-filter:blur(30px);border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.3);
  display:none;z-index:90;padding:25px;
}
#startMenu.show{display:block}
.app-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:15px;margin-top:20px}
.app{text-align:center;padding:10px;border-radius:6px;cursor:pointer}
.app:hover{background:rgba(0,0,0,.06)}
.app-icon{width:40px;height:40px;margin:0 auto 6px;background:#0078d4;border-radius:8px;display:flex;align-items:center;justify-content:center;color:white}
.window{
  position:absolute;top:10%;left:15%;width:70%;height:65%;background:white;border-radius:8px;
  box-shadow:0 10px 30px rgba(0,0,0,.4);display:none;flex-direction:column;overflow:hidden;z-index:50
}
.window.show{display:flex}
.titlebar{height:38px;background:#f3f3f3;display:flex;align-items:center;justify-content:space-between;padding:0 12px}
.content{flex:1;padding:20px;overflow:auto}
</style>
</head>

<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Win11 v1.5 FIX</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI,sans-serif}
body{height:100vh;overflow:hidden;background:#0078d4}
#wall{position:fixed;inset:0;background:#0078d4}
#bloom{position:absolute;left:15%;top:5%;width:70%;height:75%;background:radial-gradient(ellipse at 30% 20%,#8ecfff 0%,#3a9bff 30%,#005ca9 70%);border-radius:50%;filter:blur(10px)}
#desk{position:relative;height:calc(100vh - 52px);padding:12px;display:flex;flex-direction:column;gap:12px;z-index:10}
.ic{width:80px;text-align:center;color:#fff;font-size:12px;padding:8px;border-radius:6px;cursor:pointer}
.ic b{font-size:32px;display:block}
.ic:hover{background:rgba(255,255,255,.2)}
.win{position:fixed;top:10%;left:5%;width:90%;max-width:600px;height:60vh;background:#fff;border-radius:12px;display:none;flex-direction:column;box-shadow:0 20px 60px #000a;z-index:100;border:1px solid #ddd}
.top{height:44px;background:#f0f0f0;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid #ddd;font-weight:600;border-radius:12px 12px 0 0}
.body{flex:1;padding:16px;overflow:auto}
.x{width:32px;height:32px;display:grid;place-items:center;border-radius:6px;cursor:pointer}
.x:hover{background:#e11;color:#fff}
#task{position:fixed;bottom:0;left:0;right:0;height:52px;background:#f3f3f3;display:flex;align-items:center;justify-content:center;gap:8px;z-index:999;border-top:1px solid #ddd}
.t{width:44px;height:44px;display:grid;place-items:center;border-radius:6px;cursor:pointer;font-size:20px}
.t:hover{background:#ddd}
</style>
</head>
<body>
<div id="wall"><div id="bloom"></div></div>

<div id="desk">
<div class="ic" onclick="document.getElementById('w-files').style.display='flex'"><b>📁</b>MEUS APPS</div>
<div class="ic" onclick="document.getElementById('w-pc').style.display='flex'"><b>💻</b>Este PC</div>
<div class="ic" onclick="document.getElementById('w-edge').style.display='flex'"><b>🌐</b>Edge</div>
<div class="ic" onclick="document.getElementById('w-paint').style.display='flex'"><b>🎨</b>Paint</div>
</div>

<div id="w-files" class="win" style="display:flex"><div class="top">📁 MEUS APPS <div class="x" onclick="this.parentElement.parentElement.style.display='none'">✕</div></div><div class="body"><h3>✅ SE APARECER ISSO, FUNCIONOU!</h3><br>Se os apps não abriam antes, agora vão abrir.<br><br>📁 Pasta Projetos<br>📄 teste.txt</div></div>

<div id="w-pc" class="win"><div class="top">💻 Este PC <div class="x" onclick="this.parentElement.parentElement.style.display='none'">✕</div></div><div class="body">💾 Disco C: 120GB</div></div>

<div id="w-edge" class="win" style="max-width:850px"><div class="top">🌐 Edge Fake <div class="x" onclick="this.parentElement.parentElement.style.display='none'">✕</div></div><div class="body" style="text-align:center;padding-top:40px"><img src="https://upload.wikimedia.org/wikipedia/commons/9/98/Microsoft_Edge_logo_%282019%29.svg" width="70"><h2 style="margin:16px 0">Edge Fake Funcionando</h2><button onclick="window.open('https://google.com','_blank')" style="padding:10px 20px;margin:4px">Google</button><button onclick="window.open('https://youtube.com','_blank')" style="padding:10px 20px;margin:4px">YouTube</button></div></div>

<div id="w-paint" class="win"><div class="top">🎨 Paint <div class="x" onclick="this.parentElement.parentElement.style.display='none'">✕</div></div><div class="body">Paint aberto! Pode desenhar aqui depois.</div></div>

<div id="task">
<div class="t">⊞</div>
<div class="t" onclick="document.getElementById('w-files').style.display='flex'">📁</div>
<div class="t" onclick="document.getElementById('w-edge').style.display='flex'">🌐</div>
<div style="position:absolute;right:12px;font-size:12px">15:45</div>
</div>

<script>
// Esconde o MEUS APPS depois de 2 segundos pra vc testar clicar de novo
setTimeout(()=>{document.getElementById('w-files').style.display='none'},2000)
</script>
</body>
</html>

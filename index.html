<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  height:100vh;width:100vw;overflow:hidden;
  background: #0d47a1;
  background: radial-gradient(ellipse at 50% 120%, #42a5f5 0%, #1e88e5 25%, #1565c0 50%, #0d47a1 80%);
  font-family: 'Segoe UI', sans-serif;
}
#icons{padding:18px;display:flex;flex-direction:column;gap:26px}
.icon{width:80px;text-align:center;color:white}
.icon b{font-size:48px;display:block}
.icon p{font-size:12px;text-shadow:0 1px 3px black}
#taskbar{
  position:fixed;bottom:0;left:0;right:0;height:54px;
  background:#f3f3f3;display:flex;align-items:center;
  justify-content:center;gap:22px;
}
.btn{font-size:26px;width:42px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:6px;background:white;box-shadow:0 1px 2px rgba(0,0,0,.2)}
#time{position:absolute;right:14px;font-size:12px}
</style>
</head>
<body>
<div id="icons">
  <div class="icon"><b>🗑️</b><p>Lixeira</p></div>
  <div class="icon"><b>🌐</b><p>Edge</p></div>
  <div class="icon"><b>📁</b><p>Arquivos</p></div>
</div>
<div id="taskbar">
  <div class="btn">⊞</div>
  <div>🔍</div>
  <div>📁</div>
  <div>🌐</div>
  <div id="time">23:35<br>26/09</div>
</div>
</body>
</html>

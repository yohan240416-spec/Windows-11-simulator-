<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Windows 11 Simulator 2.0 - Yohan</title>
<style>
body { margin:0; font-family:Segoe UI; overflow:hidden; transition:0.3s; }
body.windows11 { background: url('https://wallpapercave.com/wp/wp12069614.jpg') no-repeat center/cover; }
body.windowsxp { background: url('https://wallpaperaccess.com/full/782188.jpg') no-repeat center/cover; }
body.windowsvista { background: url('https://wallpapercave.com/wp/wp3614174.jpg') no-repeat center/cover; }
body.windows7 { background: url('https://wallpaperaccess.com/full/1223057.jpg') no-repeat center/cover; }

#desktop { width:100vw; height:100vh; display:flex; flex-wrap:wrap; padding:10px; gap:15px; }
.icone { width:80px; text-align:center; cursor:pointer; color:white; text-shadow:1px 1px 2px black; }
.icone img { width:50px; height:50px; }

#taskbar { position:fixed; bottom:0; width:100%; height:50px; background:rgba(0,0,0,0.8); display:flex; align-items:center; padding:0 10px; }
#start-btn { background:white; border:none; padding:8px 15px; border-radius:5px; cursor:pointer; font-weight:bold; }

#start-menu { position:fixed; bottom:55px; left:10px; width:300px; background:white; border-radius:10px; padding:15px; display:none; box-shadow:0 0 20px rgba(0,0,0,0.5); }
#start-menu button { width:100%; padding:10px; margin:5px 0; border:none; background:#eee; cursor:pointer; border-radius:5px; text-align:left; }
#start-menu button:hover { background:#0078d4; color:white; }

.janela { position:fixed; top:10%; left:20%; width:60%; height:70%; background:white; border-radius:10px; display:none; flex-direction:column; overflow:hidden; box-shadow:0 0 30px rgba(0,0,0,0.5); }
.janela .barra { background:#0078d4; color:white; padding:10px; display:flex; justify-content:space-between; }
.janela iframe { width:100%; height:100%; border:none; }

#store-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; padding:15px; }
.app-card { background:#f3f3f3; padding:15px; border-radius:10px; text-align:center; cursor:pointer; }
.app-card img { width:60px; }
</style>
</head>
<body class="windows11">

<div id="desktop"></div>

<!-- MENU INICIAR -->
<div id="start-menu">
  <h3>Escolher Windows</h3>
  <button onclick="mudarTema('windowsxp')">🖥️ Windows XP</button>
  <button onclick="mudarTema('windowsvista')">💎 Windows Vista</button>
  <button onclick="mudarTema('windows7')">✨ Windows 7</button>
  <button onclick="mudarTema('windows11')">🚀 Windows 11</button>
  <hr>
  <button onclick="abrirJanela('store')">🛒 Loja de Apps</button>
  <button onclick="abrirJanela('chrome115')">🌐 Windows Chrome 115</button>
</div>

<!-- LOJA -->
<div id="store" class="janela" style="display:none">
  <div class="barra"><span>Windows Store - Fake mas instala de verdade</span><span onclick="fecharJanela('store')" style="cursor:pointer">X</span></div>
  <div id="store-grid"></div>
</div>

<!-- WINDOWS CHROME 115 -->
<div id="chrome115" class="janela" style="display:none">
  <div class="barra"><span>🌐 Windows Chrome 115 - Seu Google</span><span onclick="fecharJanela('chrome115')" style="cursor:pointer">X</span></div>
  <div style="padding:10px; display:flex; gap:5px;">
    <input id="pesquisa" type="text" placeholder="Pesquisar no Windows Chrome 115..." style="flex:1; padding:10px; border-radius:20px; border:1px solid #ccc;">
    <button onclick="pesquisar()" style="padding:10px 20px; background:#0078d4; color:white; border:none; border-radius:20px;">Pesquisar</button>
  </div>
  <iframe id="resultado" src="https://duckduckgo.com/"></iframe>
</div>

<!-- BARRA DE TAREFAS -->
<div id="taskbar">
  <button id="start-btn" onclick="toggleStart()">⊞ Iniciar</button>
</div>

<script>
// TEMAS
function mudarTema(tema){
  document.body.className = tema;
  toggleStart();
}

// MENU INICIAR
function toggleStart(){
  let menu = document.getElementById("start-menu");
  menu.style.display = menu.style.display === "block" ? "none" : "block";
}

// JANELAS
function abrirJanela(id){ document.getElementById(id).style.display = "flex"; }
function fecharJanela(id){ document.getElementById(id).style.display = "none"; }

// LOJA DE APPS
const apps = [
  { nome:"Roblox", img:"https://upload.wikimedia.org/wikipedia/commons/3/3a/Roblox_player_icon_black.svg", link:"https://www.roblox.com/pt/" },
  { nome:"PK XD", img:"https://play-lh.googleusercontent.com/Ur0P9zM0fNf3a8G0e7d0-2d0_example", link:"https://playpkxd.com/" },
  { nome:"Craftsman", img:"https://play-lh.googleusercontent.com/9-0_example", link:"https://craftsman-game.com/" }
];

// Imagens reais pra não quebrar
const appsFix = [
  { nome:"Roblox", img:"https://cdn-icons-png.flaticon.com/512/5968/5968751.png", link:"https://www.roblox.com/pt/" },
  { nome:"PK XD", img:"https://cdn-icons-png.flaticon.com/512/5968/5968751.png", link:"https://www.roblox.com/pt/" },
  { nome:"Craftsman", img:"https://cdn-icons-png.flaticon.com/512/5968/5968751.png", link:"https://www.roblox.com/pt/" }
];

let grid = document.getElementById("store-grid");
let desktop = document.getElementById("desktop");

appsFix.forEach((app, i)=>{
  grid.innerHTML += `
    <div class="app-card" onclick="instalarApp(${i})">
      <img src="${app.img}"><p>${app.nome}</p><small>Clique para instalar</small>
    </div>`;
});

function instalarApp(i){
  let app = appsFix[i];
  desktop.innerHTML += `<div class="icone" onclick="window.open('${app.link}','_blank')"><img src="${app.img}"><p>${app.nome}</p></div>`;
  alert(app.nome + " instalado na área de trabalho! Clique nele pra jogar à vontade!");
  fecharJanela('store');
}

// WINDOWS CHROME 115
function pesquisar(){
  let termo = document.getElementById("pesquisa").value;
  if(!termo) return;
  document.getElementById("resultado").src = "https://duckduckgo.com/?q=" + encodeURIComponent(termo) + "&ia=web";
}

// DETECTAR WINDOWS ANTIGO
window.onload = ()=>{
  alert("Windows 11 Simulator 2.0 carregado! Suporte: XP, Vista, 7+ e 11. Versão pesada ativada! Windows Chrome 115 pronto!");
}
</script>
</body>
</html>

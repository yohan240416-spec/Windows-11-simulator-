<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Windows 11 Simulator 1.6.1</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{width:100vw;height:100vh;overflow:hidden;background:#0f6cbd}
#wall{position:fixed;inset:0;background:radial-gradient(circle at 50% 0%, #4da6ff 0%, #0f6cbd 40%, #001e36 100%)}
#icons{position:absolute;top:12px;left:12px;display:flex;flex-direction:column;gap:18px;z-index:1}
.icon{width:80px;text-align:center;color:#fff;font-size:12px;cursor:pointer;text-shadow:0 1px 2px #000}
.icon b{width:48px;height:48px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.15);backdrop-filter:blur(10px);border-radius:10px;margin:0 auto 6px;font-size:26px}

#taskbar{position:fixed;bottom:0;width:100%;height:56px;background:rgba(255,255,255,.88);backdrop-filter:blur(25px);display:flex;align-items:center;justify-content:center;gap:6px;z-index:1000}
.t{width:42px;height:42px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:22px}
.t:hover{background:rgba(0,0,0,.08)} .t.active{background:rgba(0,0,0,.15)}
#clock{position:absolute;right:14px;font-size:13px;color:#000;text-align:right;line-height:1.2}

.win{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:92%;max-width:900px;height:72%;background:#fff;border-radius:10px;box-shadow:0 30px 80px rgba(0,0,0,.5);display:none;flex-direction:column;z-index:500;overflow:hidden}
.win.show{display:flex}
.title{height:44px;background:#f3f3f3;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid #e5e5e5;font-size:14px;font-weight:600}
.dot{width:14px;height:14px;border-radius:50%;display:inline-block;cursor:pointer;margin-left:8px}
.content{flex:1;overflow:auto;background:#fff;position:relative}
iframe{width:100%;height:100%;border:0}

#start{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);width:600px;max-width:94vw;height:620px;background:rgba(253,253,253,.96);backdrop-filter:blur(30px);border-radius:10px;display:none;z-index:999;box-shadow:0 20px 60px rgba(0,0,0,.4);padding:24px}
#start.show{display:block}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:16px}
.app{background:#f3f3f3;border-radius:8px;padding:14px 4px;text-align:center;cursor:pointer;font-size:12px}
.app:hover{background:#e9e9e9}.app span{font-size:26px;display:block;margin-bottom:6px}
</style>
</head>
<body>
<div id="wall"></div>

<div id="icons">
<div class="icon" onclick="openApp('explorer')"><b>📁</b>Explorador</div>
<div class="icon" onclick="openApp('edge')"><b>🌐</b>Edge</div>
<div class="icon" onclick="openApp('store')"><b>🛒</b>Loja</div>
<div class="icon" onclick="openApp('notepad')"><b>📝</b>Bloco de Notas</div>
<div class="icon" onclick="openApp('paint')"><b>🎨</b>Paint</div>
<div class="icon" onclick="openApp('calc')"><b>🧮</b>Calculadora</div>
</div>

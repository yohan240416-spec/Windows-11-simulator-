<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yohan OS 1.6.7</title>
<style>
/* SEU CSS DA FOTO - NÃO MUDEI NADA */
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{height:100vh;background:#0a0a18 url('https://images.unsplash.com/photo-1519681393784-d120267933ba') center/cover;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;overflow:hidden}
.start-menu{width:520px;max-width:92%;background:rgba(45,45,55,0.85);backdrop-filter:blur(30px);border:1px solid rgba(255,255,255,0.2);border-radius:24px;padding:20px 24px;margin-bottom:20px;box-shadow:0 20px 60px rgba(0,0,0,0.5);z-index:10}
.search{width:100%;margin:18px 0;background:rgba(255,255,255,0.15);border:none;border-radius:20px;padding:12px 16px;color:white;font-size:15px;outline:none}
.pinned{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.app{text-align:center;cursor:pointer;padding:6px;border-radius:12px;transition:0.2s}
.app:hover{background:rgba(255,255,255,0.12)}
.app-icon{width:56px;height:56px;border-radius:14px;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;font-size:28px;background:#fff}
.app p{color:white;font-size:11px}
/* JANELA QUE ABRE */
#appWindow{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:700px;max-width:90%;height:450px;background:#1e1e2a;border-radius:16px;border:1px solid rgba(255,255,255,.2);display:none;flex-direction:column;z-index:999}
#appWindow.show{display:flex}
#appWindow .top{height:40px;background:rgba(255,255,255,.1);display:flex;justify-content:space-between;align-items:center;padding:0 14px;color:white}
#appWindow .body{flex:1;padding:20px;color:white;overflow:auto}
#appWindow iframe{width:100%;height:100%;border:none;border-radius:0 0 16px 16px;background:white}
.taskbar{width:92%;max-width:900px;background:rgba(30,30,40,0.85);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.15);border-radius:20px;padding:8px 18px;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
</style>
</head>
<body>

<!-- JANELA ÚNICA QUE TODOS OS APPS USAM -->
<div id="appWindow">
  <div class="top"><span id="winTitle">App</span><button onclick="closeWin()" style="width:24px;height:24px;border-radius:50%;border:none;background:#ff5f56;color:white;cursor:pointer">X</button></div>
  <div class="body" id="winBody"></div>
</div>

<!-- SEU START MENU DA FOTO - IDÊNTICO -->
<div class="start-menu">
  <div style="display:flex;justify-content:space-between;color:white"><div><h1 style="font-size:26px">Yohan OS</h1><span style="color:#8bb4ff">version 1.7.8</span></div><div>🔔 ⓘ</div></div>
  <input class="search" placeholder="🔍 Search apps, settings, documents">
  <div style="color:white;margin:16px 0 12px;font-size:18px;font-weight:600">Pinned</div>
  <div class="pinned">
    <div class="app" onclick="openApp('chrome')"><div class="app-icon">🌐</div><p>Chrome 90 • by Yohan</p></div>
    <div class="app" onclick="openApp('store')"><div class="app-icon">🛍️</div><p>Store</p></div>
    <div class="app" onclick="openApp('photos')"><div class="app-icon">🌸</div><p>Photos</p></div>
    <div class="app" onclick="openApp('settings')"><div class="app-icon">⚙️</div><p>Settings</p></div>
    <div class="app" onclick="openApp('mail')"><div class="app-icon" style="background:#5aa9ff">✉️</div><p>Mail</p></div>
    <div class="app" onclick="openApp('calendar')"><div class="app-icon" style="background:#a0d8ff">📅</div><p>Calendar</p></div>
    <div class="app" onclick="openApp('explorer')"><div class="app-icon" style="background:#8ec5ff">📁</div><p>File Explorer</p></div>
    <div class="app" onclick="openApp('vscode')"><div class="app-icon" style="background:#2a4b8d;color:white">VS</div><p>VS Code</p></div>
    <div class="app" onclick="openApp('spotify')"><div class="app-icon" style="background:#1ed760">🎵</div><p>Spotify</p></div>
    <div class="app" onclick="openApp('notepad')"><div class="app-icon">📝</div><p>Notepad</p></div>
    <div class="app" onclick="openApp('calc')"><div class="app-icon" style="background:#ff9a3c">🧮</div><p>Calculator</p></div>
    <div class="app" onclick="openApp('terminal')"><div class="app-icon" style="background:#111;color:#0f0;font-size:10px">Terminal</div><p>Terminal</p></div>
  </div>
</div>

<div class="taskbar"><div style="color:white">YO 🔍 Search</div><div style="color:white">🗂️ 🌐 🛍️</div><div style="color:white;font-size:12px">9:41 PM</div></div>

<script>
// AQUI CONSERTA TODOS OS APPS
function openApp(name){
  const win = document.getElementById('appWindow');
  const title = document.getElementById('winTitle');
  const body = document.getElementById('winBody');
  win.classList.add('show');
  
  if(name==='chrome'){ title.innerText='🌐 Chrome 90 • by Yohan'; body.innerHTML='<iframe src="https://www.google.com/webhp?igu=1"></iframe>'; }
  if(name==='store'){ title.innerText='🛍️ Store'; body.innerHTML='<h2>Yohan Store 1.6.7</h2><br><button onclick="alert(\'Instalado!\')" style="padding:10px 20px;border-radius:8px;border:none;background:#0078d4;color:white;cursor:pointer">Instalar Minecraft</button><br><br><button onclick="alert(\'Instalado!\')" style="padding:10px 20px;border-radius:8px;border:none;background:#0078d4;color:white;cursor:pointer">Instalar Racing</button>'; }
  if(name==='explorer'){ title.innerText='📁 File Explorer'; body.innerHTML='📄 YohanOS_1.6.7.exe<br>📁 Chrome90/<br>📁 Store/'; }
  if(name==='settings'){ title.innerText='⚙️ Settings'; body.innerHTML='<b>Yohan OS 1.6.7 .EXE</b><br>Chrome desde 1.6.5<br>Tela Win11'; }
  if(name==='photos'){ title.innerText='🌸 Photos'; body.innerHTML='Suas fotos aqui'; }
  if(name==='mail'){ title.innerText='✉️ Mail'; body.innerHTML='Mail - Em breve'; }
  if(name==='calendar'){ title.innerText='📅 Calendar'; body.innerHTML='Hoje: 15'; }
  if(name==='vscode'){ title.innerText='VS Code'; body.innerHTML='Editor de código'; }
  if(name==='spotify'){ title.innerText='Spotify'; body.innerHTML='🎵 Player'; }
  if(name==='notepad'){ title.innerText='Notepad'; body.innerHTML='<textarea style="width:100%;height:200px;border-radius:8px;padding:10px">Digite aqui...</textarea>'; }
  if(name==='calc'){ title.innerText='Calculator'; body.innerHTML='<h1>2+2=4</h1>'; }
  if(name==='terminal'){ title.innerText='Terminal'; body.innerHTML='> YohanOS 1.6.7<br>> Chrome 90 by Yohan'; }
}
function closeWin(){ document.getElementById('appWindow').classList.remove('show'); }
</script>
</body>
</html>

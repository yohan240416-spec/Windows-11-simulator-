<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Win11</title>
<style>
body{margin:0;height:100vh;overflow:hidden;font-family:Segoe UI}
#wall{position:fixed;inset:0;background:#0078d4}
#bloom{position:absolute;left:10%;top:5%;width:80%;height:80%;
background:radial-gradient(ellipse,#6ec6ff 0%,#0078d4 60%);
border-radius:50%;filter:blur(20px)}
#lock{position:fixed;inset:0;z-index:9999;
background:#005a9e;display:flex;
align-items:center;justify-content:center;
flex-direction:column;color:#fff}
#task{position:fixed;bottom:0;left:0;right:0;
height:50px;background:#f3f3f3;
display:flex;align-items:center;
justify-content:center;gap:10px}
</style>
</head>
<body>
<div id="wall"><div id="bloom"></div></div>
<div id="lock" onclick="this.remove()">
<h1 style="font-size:50px;font-weight:200">15:40</h1>
<p>Clique para entrar</p>
<button style="margin-top:20px;padding:10px 20px;
border-radius:20px;border:0">
Entrar
</button>
</div>
<div style="position:relative;padding:20px;color:#fff">
📁 MEUS APPS<br><br>💻 Este PC<br><br>🌐 Edge
</div>
<div id="task">⊞ Windows 11 - v1.2.0 REAL</div>
</body>
</html>

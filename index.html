<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Windows 11 - Yohan</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{
 height:100vh;overflow:hidden;
 /* AQUI ESTÁ SUA FOTO DO WINDOWS 11 */
 background: #0a1930 url('https://4kwallpapers.com/images/wallpapers/windows-11-dark-mode-elastic-4480x2520-12026.jpg') center/cover no-repeat fixed;
}
#desktop{position:absolute;top:12px;left:12px;display:flex;flex-direction:column;gap:16px}
.icon{width:82px;color:white;text-align:center;cursor:pointer;padding:8px;border-radius:8px;text-shadow:0 1px 5px black}
.icon:hover{background:rgba(255,255,255,.18)}
.icon p{font-size:12px;margin-top:4px}

#taskbar{position:fixed;bottom:0;width:100%;height:52px;background:rgba(32,32,32,.85);backdrop-filter:blur(20px);display:flex;justify-content:center;align-items:center;gap:10px;border-top:1px solid rgba(255,255,255,.1)}
.task{width:42px;height:42px;display:grid;place-items:center;border-radius:6px;cursor:pointer;color:white;font-size:22px}
.task:hover{background:rgba(255,255,255,.15)}
.win{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:850px;max-width:95vw;height:560px;background:white;border-radius:10px;display:none;flex-direction:column;box-shadow:0 20px 60px black;overflow:hidden}
.win.show{display:flex}
.wtop{height:42px;background:#f3f3f3;display:flex;justify-content:space-between;align-items:center;padding:0 14px;border-bottom:1px solid #ddd}
.wbody{flex:1}
iframe{width:100%;height:100%;border:none}
</style>
</head>
<body>

<div id="desktop">
<div class="icon" onclick="window.open('https://www.roblox.com/pt')"><div style="font-size:40px">🟥</div><p>Roblox</p></div>
<div class="icon" onclick="window.open('https://www.pkxdgame.com')"><div style="font-size:40px">🎮</div><p>PK XD</p></div>
<div class="icon" onclick="window.open('https://www.crazygames.com/game/craftsman-building-craft')"><div style="font-size:40px">⛏️</div><p>Craftsman</p></div>
<div class="icon" onclick="openWin('chrome')"><div style="font-size:40px">🌐</div><p>Chrome 115</p></div>
</div>

<div id="taskbar">
<div class="task" style="background:white;color:black" onclick="alert('Menu Iniciar')">⊞</div>
<div class="task" onclick="openWin('chrome')">🌐</div>
<div class="task" onclick="openWin('explorer')">📁</div>
<div class="task" onclick="openWin('store')">🛒</div>
</div>

<div id="chrome" class="win" style="width:92%;height:80%"><div class="wtop"><span>Chrome 115</span><span onclick="closeWin('chrome')" style="cursor:pointer">✕ Fechar</span></div><div class="wbody"><iframe src="https://duckduckgo.com"></iframe></div></div>
<div id="explorer" class="win"><div class="wtop"><span>Explorador</span><span onclick="closeWin('explorer')" style="cursor:pointer">✕</span></div><div class="wbody" style="padding:20px">Seus apps: Roblox, PK XD, Craftsman, Chrome 115<br><br>SEM HOMEM OBESO - 100% LIMPO</div></div>
<div id="store" class="win"><div class="wtop"><span>Microsoft Store</span><span onclick="closeWin('store')" style="cursor:pointer">✕</span></div><div class="wbody" style="padding:20px">Loja - Clique para instalar seus jogos</div></div>

<script>
function openWin(id){document.getElementById(id).classList.add('show')}
function closeWin(id){document.getElementById(id).classList.remove('show')}
</script>
</body>
</html>

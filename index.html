<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Windows 11</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui}
body{height:100vh;overflow:hidden;background:#000}
.bg{position:absolute;inset:0;background:url('https://4kwallpapers.com/images/wallpapers/windows-11-dark-mode-3840x2400-9263.jpg') center/cover}
.desktop{position:relative;z-index:1;height:calc(100vh - 48px);padding:12px;display:grid;grid-template-columns:80px;gap:12px;align-content:start}
.app{display:flex;flex-direction:column;align-items:center;gap:4px;color:white;font-size:11px;text-shadow:0 1px 3px #000;cursor:pointer;padding:6px;border-radius:6px}
.app:hover{background:rgba(255,255,255,.15)}
.app i{width:48px;height:48px;background:linear-gradient(180deg,#3aa0ff,#0067c0);border-radius:10px;display:grid;place-items:center;font-size:24px}
.taskbar{position:absolute;bottom:0;left:0;right:0;height:48px;background:rgba(32,32,32,.85);backdrop-filter:blur(30px);border-top:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;z-index:50}
.center{display:flex;gap:8px}
.tb-icon{width:36px;height:36px;display:grid;place-items:center;border-radius:6px;cursor:pointer;color:white;font-size:20px}
.tb-icon:hover{background:rgba(255,255,255,.12)}
.start-menu{position:absolute;bottom:60px;left:50%;transform:translateX(-50%);width:620px;max-width:94vw;background:rgba(37,37,37,.92);backdrop-filter:blur(40px);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:20px;display:none;z-index:40}
.start-menu.open{display:block}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.grid div{background:rgba(255,255,255,.07);border-radius:8px;padding:14px 6px;text-align:center;color:white;font-size:11px;cursor:pointer}
.legacy{margin-top:18px;padding-top:14px;border-top:1px solid rgba(255,255,255,.1)}
.legacy button{background:#0078d4;color:white;border:0;padding:8px 14px;border-radius:6px;font-weight:600;cursor:pointer;margin:4px}
.legacy button.sec{background:rgba(255,255,255,.12)}
.win{position:absolute;top:50%;left:50%;transform:translate(-50%,-55%);width:700px;max-width:92vw;height:420px;background:rgba(32,32,32,.97);border:1px solid rgba(255,255,255,.12);border-radius:10px;display:none;flex-direction:column;z-index:60}
.win.open{display:flex}
.win-header{height:40px;background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:space-between;padding:0 12px;color:white}
.close{width:28px;height:28px;display:grid;place-items:center;border-radius:5px;cursor:pointer}
.close:hover{background:#e81123}
.win-body{flex:1;padding:20px;color:white}
.win-body button{background:#0078d4;color:white;border:0;padding:8px 14px;border-radius:6px;margin:5px}
</style>
</head>
<body>
<div class="bg"></div>
<div class="desktop">
  <div class="app" onclick="abrir('explorer')"><i>📁</i>Explorador</div>
  <div class="app" onclick="abrir('store')"><i style="background:linear-gradient(180deg,#00d1ff,#0078d4)">🛒</i>Store</div>
  <div class="app" onclick="abrir('roblox')"><i style="background:#111">🎮</i>Roblox</div>
</div>

<div class="win" id="win-explorer"><div class="win-header"><span>📁 Explorador</span><div class="close" onclick="fechar('explorer')">✕</div></div><div class="win-body">Arquivos: OK ✅</div></div>
<div class="win" id="win-store"><div class="win-header"><span>🛒 Store</span><div class="close" onclick="fechar('store')">✕</div></div><div class="win-body"><button class="sec" onclick="alert('v1.5.0 rodando!')">Rodar v1.5.0</button><button class="sec" onclick="alert('v1.6.0 rodando!')">Rodar v1.6.0</button><button onclick="alert('v1.6.2 rodando!')">Rodar v1.6.2</button><button class="sec" onclick="alert('v1.6.3 rodando!')">Rodar v1.6.3</button></div></div>
<div class="win" id="win-roblox"><div class="win-header"><span>🎮 Roblox</span><div class="close" onclick="fechar('roblox')">✕</div></div><div class="win-body"><button onclick="alert('Roblox iniciado!')">▶ Jogar</button></div></div>

<div class="start-menu" id="startMenu">
  <h3 style="color:white;margin-bottom:10px">Fixado</h3>
  <div class="grid"><div onclick="abrir('explorer')">Explorador</div><div onclick="abrir('store')">Store</div><div onclick="abrir('roblox')">Roblox</div></div>
  <div class="legacy"><button class="sec" onclick="alert('v1.5.0')">Rodar v1.5.0</button><button onclick="alert('v1.6.2')">Rodar v1.6.2</button></div>
</div>

<div class="taskbar">
  <div class="center">
    <div class="tb-icon" onclick="toggleStart()" style="background:rgba(255,255,255,.18)">⊞</div>
    <div class="tb-icon" onclick="abrir('explorer')">📁</div>
    <div class="tb-icon" onclick="abrir('store')">🛒</div>
    <div class="tb-icon" onclick="abrir('roblox')">🎮</div>
  </div>
</div>

<script>
function abrir(id){document.getElementById('win-'+id).classList.add('open'); document.getElementById('startMenu').classList.remove('open');}
function fechar(id){document.getElementById('win-'+id).classList.remove('open');}
function toggleStart(){document.getElementById('startMenu').classList.toggle('open');}
window.abrir=abrir; window.fechar=fechar; window.toggleStart=toggleStart;
</script>
</body>
</html>

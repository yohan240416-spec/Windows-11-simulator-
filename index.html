<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<style>
body{margin:0;height:100vh;background:linear-gradient(135deg,#1e88e5,#0d47a1);font-family:Arial}
.icone{width:90px;text-align:center;color:white;margin:20px;cursor:pointer}
.icone div{font-size:50px}
.janela{display:none;position:fixed;top:30%;left:10%;right:10%;background:white;border-radius:12px;padding:0;box-shadow:0 10px 30px black;z-index:99}
.janela b{display:block;background:#ddd;padding:10px;border-radius:12px 12px 0 0}
.janela p{padding:20px}
#barra{position:fixed;bottom:0;left:0;right:0;height:60px;background:#eee;display:flex;align-items:center;justify-content:space-around}
</style>
</head>
<body>

<div class="icone" onclick="document.getElementById('j1').style.display='block'"><div>🗑️</div>Lixeira</div>
<div class="icone" onclick="document.getElementById('j2').style.display='block'"><div>💻</div>Meu PC</div>
<div class="icone" onclick="document.getElementById('j3').style.display='block'"><div>📁</div>Pastas</div>
<div class="icone" onclick="document.getElementById('j4').style.display='block'"><div>🌐</div>Edge</div>

<div class="janela" id="j1"><b>Lixeira <span onclick="this.parentElement.parentElement.style.display='none'" style="float:right;cursor:pointer">X</span></b><p>Lixeira vazia!</p></div>
<div class="janela" id="j2"><b>Meu PC <span onclick="this.parentElement.parentElement.style.display='none'" style="float:right;cursor:pointer">X</span></b><p>Seu PC: 120GB livres</p></div>
<div class="janela" id="j3"><b>Arquivos <span onclick="this.parentElement.parentElement.style.display='none'" style="float:right;cursor:pointer">X</span></b><p>📄 Documentos<br>🖼️ Fotos</p></div>
<div class="janela" id="j4"><b>Edge <span onclick="this.parentElement.parentElement.style.display='none'" style="float:right;cursor:pointer">X</span></b><p>Edge funcionando! ✅</p></div>

<div id="barra"><span>⊞</span><span>🔍</span><span>📁</span><span>🌐</span><span id="hora"></span></div>

<script>setInterval(()=>{document.getElementById('hora').innerHTML=new Date().toLocaleTimeString().slice(0,5)},1000)</script>
</body>
</html>

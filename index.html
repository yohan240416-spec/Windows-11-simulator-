<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Windows 11</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui}
body{height:100vh;overflow:hidden;background:#000}
.bg{position:absolute;inset:0;background:url('https://wallpapers.com/images/hd/windows-11-4k-qhd-3840x2160-9x1o9q9h5x1z3v9o.jpg') center/cover}
.bg{background-image:url('https://4kwallpapers.com/images/wallpapers/windows-11-dark-mode-3840x2400-9263.jpg')}
.desktop{position:relative;z-index:1;height:calc(100vh - 48px);padding:12px;display:grid;grid-template-columns:80px;gap:12px;align-content:start}
.app{display:flex;flex-direction:column;align-items:center;gap:4px;color:white;font-size:11px;text-shadow:0 1px 3px #000;cursor:pointer;padding:6px;border-radius:6px}
.app:hover{background:rgba(255,255,255,.15)}
.app i{width:48px;height:48px;background:linear-gradient(180deg,#3aa0ff,#0067c0);border-radius:10px;display:grid;place-items:center;font-size:24px;box-shadow:0 4px 10px rgba(0,0,0,.3)}
.taskbar{position:absolute;bottom:0;left:0;right:0;height:48px;background:rgba(32,32,32,.8);backdrop-filter:blur(30px) saturate(1.5);border-top:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;z-index:10}
.center{display:flex;gap:8px;align-items:center}
.tb-icon{width:36px;height:36px;display:grid;place-items:center;border-radius:6px;cursor:pointer;transition:.15s;color:white;font-size:20px}
.tb-icon:hover{background:rgba(255,255,255,.12)}
.tb-icon.start{background:rgba(255,255,255,.18)}
.start-menu{position:absolute;bottom:60px;left:50%;transform:translateX(-50%);width:620px;max-width:94vw;background:rgba(37,37,37,.92);backdrop-filter:blur(40px);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.5);display:none;z-index:20}
.start-menu.open{display:block}
.start-menu h3{color:white;font-size:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.grid div{background:rgba(255,255,255,.07);border-radius:8px;padding:14px 6px;text-align:center;color:white;font-size:11px;cursor:pointer}
.grid div:hover{background:rgba(255,255,255,.14)}
.legacy{margin-top:18px;padding-top:14px;border-top:1px solid rgba(255,255,255,.1)}
.legacy .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.legacy button{background:#0078d4;color:white;border:0;padding:8px 14px;border-radius:6px;font-weight:600;cursor:pointer}
.legacy button.sec{background:rgba(255,255,255,.12)}
.legacy button:hover{filter:brightness(1.15)}
</style>
</head>
<body>
<div class="bg"></div>
<div class="desktop">
  <div class="app"><i>📁</i>Explorador</div>
  <div class="app"><i style="background:linear-gradient(180deg,#00d1ff,#0078d4)">🛒</i>Store</div>
  <div class="app"><i style="background:linear-gradient(180deg,#222,#000)">🎮</i>Roblox</div>
</div>

<div class="start-menu" id="startMenu">
  <h3>Fixado</h3>
  <div class="grid">
    <div>Edge</div><div>Word</div><div>Excel</div><div>Store</div><div>Fotos</div><div>Config</div>
  </div>
  <div class="legacy">
    <h3>Windows 11 - Legacy Pack</h3>
    <div class="row">
      <button class="sec">Rodar v1.5.0 (Clássica)</button>
      <button class="sec">Rodar v1.6.0</button>
      <button>Rodar v1.6.2 (Hoje)</button>
      <button class="sec">Rodar v1.6.3 (Legacy)</button>
    </div>
    <h3 style="margin-top:16px">Microsoft Store - Legacy</h3>
    <div class="row">
      <button>Roblox - Instalar</button>
    </div>
  </div>
</div>

<div class="taskbar">
  <div class="center">
    <div class="tb-icon start" id="btnStart">⊞</div>
    <div class="tb-icon">🔍</div>
    <div class="tb-icon">▭</div>
    <div class="tb-icon">🌐</div>
    <div class="tb-icon">🛒</div>
  </div>
</div>

<script>
const start=document.getElementById('btnStart'), menu=document.getElementById('startMenu');
start.onclick=()=>menu.classList.toggle('open');
document.addEventListener('click',e=>{
  if(!menu.contains(e.target) && !start.contains(e.target)) menu.classList.remove('open')
})
</script>
</body>
</html>

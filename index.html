<!-- 1.6.3 LEGACY - Version Selector -->
<div id="legacy-menu">
  <h1>Windows 11 - Legacy Pack</h1>
  <button onclick="loadVersion('1.5.0')">Rodar v1.5.0 (Clássica)</button>
  <button onclick="loadVersion('1.6.0')">Rodar v1.6.0</button>
  <button onclick="loadVersion('1.6.2')">Rodar v1.6.2 (Hoje)</button>
  <button onclick="loadVersion('1.6.3')">Rodar v1.6.3 (Legacy)</button>
</div>

<!-- Loja Fake -->
<div id="store">
  <h2>Microsoft Store - Legacy</h2>
  <div class="app">
    <span>Roblox</span>
    <button onclick="installRoblox()">Instalar</button>
  </div>
</div>

<script>
// Carregar versão
function loadVersion(v){
  console.log("Carregando " + v);
  window.location.href = "./versions/" + v + "/index.html";
}

// Instalar Roblox de verdade
function installRoblox(){
  if(confirm("Instalar Roblox oficial?")){
    window.open("https://www.roblox.com/download", "_blank");
  }
}

// Bloqueio para celular/note fraco
function checkDevice(){
  let ram = navigator.deviceMemory || 4;
  if(ram < 4){
    alert("Essa Legacy precisa de 4GB+ RAM. Tente a v1.5.0");
  }
}
checkDevice();
</script>

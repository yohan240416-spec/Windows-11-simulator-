<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Windows 11</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif;user-select:none}
body{overflow:hidden;background:#000;height:100vh;width:100vw}
#wallpaper{position:absolute;inset:0;background:url('https://images.unsplash.com/photo-1627856014759-085229246708?q=80&w=1920') center/cover no-repeat}
#lockScreen{position:absolute;inset:0;z-index:10000;background:url('https://images.unsplash.com/photo-1627856014759-085229246708?q=80&w=1920') center/cover no-repeat;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:transform .7s;cursor:pointer}
#lockScreen.hide{transform:translateY(-100%)}
#lockTime{font-size:92px;font-weight:200;color:#fff;text-shadow:0 2px 20px rgba(0,0,0,.5)}
#lockDate{font-size:22px;color:#fff;margin-top:8px}
